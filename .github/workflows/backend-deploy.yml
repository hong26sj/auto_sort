name: Deploy backend to Cloud Run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/849431387447/locations/global/workloadIdentityPools/github-actions/providers/auto-sort
          service_account: github-deployer@auto-sort-507309.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud builds submit backend --tag "gcr.io/auto-sort-507309/site-photo-uploader:latest"
      - run: >-
          gcloud run deploy site-photo-uploader
          --image "gcr.io/auto-sort-507309/site-photo-uploader:latest"
          --region asia-northeast3
          --platform managed
          --allow-unauthenticated
          --min 0 --max 3 --concurrency 4 --memory 1Gi --cpu 1 --timeout 300
          --update-secrets APPS_SCRIPT_WEB_APP_URL=APPS_SCRIPT_WEB_APP_URL:latest,APPS_SCRIPT_RELAY_KEY=APPS_SCRIPT_RELAY_KEY:latest
          --update-env-vars IMAGE_PROCESSING_MODE=jpeg,IMAGE_MAX_EDGE=2560,IMAGE_JPEG_QUALITY=80,APPS_SCRIPT_TIMEOUT_MS=120000,APPS_SCRIPT_MAX_ENCODED_BYTES=41943040
